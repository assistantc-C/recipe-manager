name: 💡 機能要望 / Feature Request
description: 新機能や改善のアイデアを提案する / Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        アイデアありがとうございます！
        Thanks for the idea!

  - type: textarea
    id: what
    attributes:
      label: どんな機能・改善が欲しいですか？ / What would you like to see?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: なぜ欲しいですか？（解決したい課題） / Why? (problem you want to solve)
      placeholder: |
        例：複数のレシピをまとめて1つの献立にしたい
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案・現状の回避方法（任意） / Alternatives or current workarounds (optional)
    validations:
      required: false
